<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>RC104 (100) search replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F7F9FB; --ink:#0F151C; --muted:#5E6A78;
  --line:#D5DCE5; --line-soft:#E6EBF1; --grid:#DCE3EA;
  --insert:#1F8F5F; --replace:#C4760F; --swap:#7A4FD0; --twoopt:#1E6FBE; --shake:#C93B2C;
  --ghost:#96A3B2; --best:#0F151C;
  --radius:9px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1116; --panel:#141B23; --panel-2:#1A222B; --ink:#E4EAF1; --muted:#8B98A8;
    --line:#26313C; --line-soft:#1E2831; --grid:#202A34;
    --insert:#3BBE85; --replace:#E39B36; --swap:#A985F0; --twoopt:#4E9DE8; --shake:#E4604F;
    --ghost:#5A6775; --best:#E4EAF1;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1116; --panel:#141B23; --panel-2:#1A222B; --ink:#E4EAF1; --muted:#8B98A8;
  --line:#26313C; --line-soft:#1E2831; --grid:#202A34;
  --insert:#3BBE85; --replace:#E39B36; --swap:#A985F0; --twoopt:#4E9DE8; --shake:#E4604F;
  --ghost:#5A6775; --best:#E4EAF1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{padding-inline:20px;padding-block:18px 26px;max-width:1440px;margin:0 auto;
      display:flex;flex-direction:column;gap:14px}

header.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 28px;
           border-bottom:1px solid var(--line);padding-bottom:14px}
.eyebrow{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-size:25px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h1 .sub{font-weight:400;color:var(--muted);font-size:15px;margin-left:8px}
.stats{display:flex;gap:6px 22px;margin:0 0 0 auto;flex-wrap:nowrap}
.stat{display:flex;flex-direction:column;gap:1px}
.stat dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat{min-width:74px}
.stat dd{margin:0;font-family:var(--mono);font-size:15px;font-weight:500;
         font-variant-numeric:tabular-nums;white-space:nowrap}

main{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start;
     grid-template-rows:auto auto}
.rail{grid-column:2;grid-row:1 / span 2;align-self:stretch}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);
       border-radius:var(--radius);overflow:hidden;min-height:430px;height:clamp(430px,58vh,720px)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;left:12px;bottom:11px;display:flex;flex-wrap:wrap;gap:5px 13px;
        max-width:calc(100% - 24px);
        font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 86%,transparent);
        padding:6px 9px;border-radius:6px;border:1px solid var(--line-soft)}
.key{display:inline-flex;align-items:center;gap:5px}
.key i{width:13px;height:3px;border-radius:2px;display:inline-block}
.hint{position:absolute;right:12px;top:11px;font-size:11px;color:var(--muted);
      font-family:var(--mono)}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--panel);
     border:1px solid var(--line);border-radius:7px;padding:8px 10px;
     box-shadow:0 6px 18px rgb(0 0 0 / .16);min-width:172px;max-width:232px}
.tip h3{margin:0 0 5px;font-size:12.5px;font-weight:600;display:flex;
        justify-content:space-between;gap:10px;align-items:baseline}
.tip h3 em{font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
           color:var(--muted);font-weight:600}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;
        font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.tip dt{color:var(--muted)} .tip dd{margin:0;text-align:right}
.tip .warn{color:var(--shake)}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.scale i{width:56px;height:8px;border-radius:4px;display:inline-block;
  background:linear-gradient(90deg,hsl(210 62% 48%),hsl(135 62% 48%),hsl(60 62% 48%))}

.rail{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;
      height:100%}
.rail .card{flex:0 0 auto}
.rail .card.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.card h2{margin:0 0 9px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--muted);font-weight:600}
.verdict{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;
         white-space:nowrap;overflow:hidden}
.verdict #vtext{overflow:hidden;text-overflow:ellipsis}
.verdict .dot{width:9px;height:9px;border-radius:50%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:9px;
    font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;
    white-space:nowrap}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right}
.delta.up{color:var(--insert)} .delta.down{color:var(--shake)}

.cands{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -4px;padding:0 4px;
       scrollbar-gutter:stable}
.seq{font-family:var(--mono);font-size:11.5px;line-height:1.7;height:96px;overflow-y:auto;
     color:var(--muted);word-break:break-word}
.seq b{color:var(--ink);font-weight:600}
.cand{display:grid;grid-template-columns:52px 1fr 60px;align-items:center;gap:8px;
      height:19px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
      white-space:nowrap;overflow:hidden}
.cand .id{color:var(--muted)}
.cand .bar{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.cand .bar i{display:block;height:100%;border-radius:3px}
.cand .w{text-align:right}
.cand.chosen{font-weight:600}
.cand.chosen .id{color:var(--ink)}
.empty{color:var(--muted);font-family:var(--mono);font-size:12px}

.timeline{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
          padding:11px 14px 12px;grid-column:1;min-width:0}
#tl{display:block;width:100%;height:112px;cursor:crosshair}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px;min-height:33px;
           padding-top:10px;border-top:1px solid var(--line-soft)}
button,select{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--panel-2);
       border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,#tl:focus-visible{outline:2px solid var(--twoopt);outline-offset:2px}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink);min-width:78px;font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:6px 14px;margin-left:auto;font-size:12.5px;color:var(--muted)}
.toggles label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.pos{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
     min-width:188px;white-space:nowrap}
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr)}
  .timeline,.rail{grid-column:1}
  .rail{grid-row:auto}
  .rail{height:auto}
  .cands{max-height:300px}
  .stage{min-height:340px;aspect-ratio:1/1}
  .stats{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <div>
      <span class="eyebrow">Iterated local search replay</span>

  <main>

    <section class="timeline">

        <option value="20">20&times;</option>

      <span class="pos" id="pos">—</span>
      <div class="toggles">
        <label><input type="checkbox" id="tProp" checked> rejected proposals</label>
        <label><input type="checkbox" id="tWin"> time windows</label>
        <label>labels
          <select id="tIds">
            <option value="off" selected>none</option>
            <option value="order">visit order</option>
            <option value="id">target id</option>
          </select></label>
      </div>
    </div>
    </section>
  </main>

</div>

<script>
const OPC={add:"--insert",replace:"--replace",swap:"--swap",two_opt:"--twoopt",shake:"--shake"};
const OPN={add:"Insert",replace:"Replace",swap:"Swap",two_opt:"2-opt",shake:"Shake"};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=n=>n==null?"—":n.toLocaleString("en-US",{maximumFractionDigits:0});
let D=null,i=0,playing=false,acc=0,last=0;

const map=document.getElementById("map"),mctx=map.getContext("2d");
const tl=document.getElementById("tl"),tctx=tl.getContext("2d");

function fit(c){const b=c.getBoundingClientRect(),d=window.devicePixelRatio||1;
  const r={width:b.width||c.parentElement.clientWidth||640,
           height:b.height||c.parentElement.clientHeight||430};
  c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);
  c.getContext("2d").setTransform(d,0,0,d,0,0);return r;}

function proj(r){
  const xs=D.nodes.map(n=>n.x),ys=D.nodes.map(n=>n.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=26,w=r.width-2*pad,h=r.height-2*pad;
  const s=Math.min(w/Math.max(1e-9,x1-x0),h/Math.max(1e-9,y1-y0));
  const ox=pad+(w-(x1-x0)*s)/2, oy=pad+(h-(y1-y0)*s)/2;
  return n=>[ox+(n.x-x0)*s, r.height-(oy+(n.y-y0)*s)];
}

function drawMap(){
  const r=fit(map),P=proj(r),f=D.frames[i],sched=new Set(f.r),byId=D.byId;
  mctx.clearRect(0,0,r.width,r.height);
  const col=css(OPC[f.e]||"--twoopt");

  if(document.getElementById("tProp").checked){
    mctx.lineWidth=1;mctx.strokeStyle=css("--ghost");mctx.globalAlpha=.34;
    for(const p of f.p){mctx.beginPath();
      const cyc=p.r.concat([D.depot]);
      cyc.forEach((n,k)=>{const q=P(byId[n]);k?mctx.lineTo(q[0],q[1]):mctx.moveTo(q[0],q[1]);});
      mctx.stroke();}
    mctx.globalAlpha=1;
  }

  const win=document.getElementById("tWin").checked;
  for(const n of D.nodes){
    if(n.id===D.depot)continue;
    const q=P(n),on=sched.has(n.id);
    mctx.beginPath();mctx.arc(q[0],q[1],on?4.2:2.6,0,7);
    if(on){mctx.fillStyle=win?winColor(n):col;mctx.fill();}
    else{mctx.strokeStyle=css("--grid");mctx.lineWidth=1.4;mctx.stroke();}
  }

  const cyc=f.r.concat([D.depot]);
  mctx.lineWidth=1.9;mctx.strokeStyle=col;mctx.lineJoin="round";
  mctx.beginPath();
  cyc.forEach((n,k)=>{const q=P(byId[n]);k?mctx.lineTo(q[0],q[1]):mctx.moveTo(q[0],q[1]);});
  mctx.stroke();
  mctx.fillStyle=col;                       // direction of travel, one arrowhead per leg
  for(let k=0;k<cyc.length-1;k++){
    const a=P(byId[cyc[k]]),b=P(byId[cyc[k+1]]);
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
    if(L<14)continue;
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,ux=dx/L,uy=dy/L,s=4.6;
    mctx.beginPath();
    mctx.moveTo(mx+ux*s,my+uy*s);
    mctx.lineTo(mx-ux*s-uy*s*0.62,my-uy*s+ux*s*0.62);
    mctx.lineTo(mx-ux*s+uy*s*0.62,my-uy*s-ux*s*0.62);
    mctx.closePath();mctx.fill();
  }

  const d=P(byId[D.depot]);
  mctx.fillStyle=css("--ink");mctx.fillRect(d[0]-5,d[1]-5,10,10);

  const lab=document.getElementById("tIds").value;
  if(lab!=="off"){
    mctx.font="10px "+css("--mono").split(",")[0].replace(/"/g,"");
    mctx.fillStyle=css("--muted");mctx.textAlign="center";
    f.r.forEach((n,k)=>{if(n===D.depot)return;const q=P(byId[n]);
      mctx.fillText(lab==="order"?String(k):String(n),q[0],q[1]-8);});
  }
  D.est=false;
  if(f.a){D.arr={};f.r.slice(1).concat([D.depot]).forEach((n,k)=>{if(f.a[k]!=null)D.arr[n]=f.a[k];});}
  else {D.arr=arrivals(f.r);D.est=true;}
  if(f.s){D.spd={};D.loi={};f.r.slice(1).concat([D.depot]).forEach((n,k)=>{
            if(f.s[k]!=null)D.spd[n]=f.s[k]; if(f.lo&&f.lo[k]!=null)D.loi[n]=f.lo[k];});}
  else {D.spd=legSpeeds(f.r.concat([D.depot]));D.loi={};D.est=true;}
  document.getElementById("winScale").style.visibility=win?"visible":"hidden";
  document.getElementById("hint").textContent="frame "+(i+1)+" / "+D.frames.length;
}

function legSpeeds(route){
  // speed each leg needs under the earliest-arrival schedule, in m/s
  const out={},v=D.vmax/D.scale;
  let a=0;
  for(let k=1;k<route.length;k++){
    const p=D.byId[route[k-1]],q=D.byId[route[k]];
    const du=Math.hypot(q.x-p.x,q.y-p.y);
    const t=Math.max(q.e, a+du/v)-a;
    out[route[k]]=t>0?du*D.scale/t:null;
    a=Math.max(q.e, a+du/v);
  }
  return out;
}

function arrivals(route){
  // earliest arrival at each visit, flying every leg at v_max and waiting for a
  // window to open: the same forward pass the search uses to test feasibility
  const out={},v=D.vmax*1/D.scale;      // coordinate units per second
  let a=0;
  for(let k=1;k<route.length;k++){
    const p=D.byId[route[k-1]],q=D.byId[route[k]];
    a=Math.max(q.e, a+Math.hypot(q.x-p.x,q.y-p.y)/v);
    out[route[k]]=a;
  }
  return out;
}

function winColor(n){
  // hue runs blue to yellow as the window opens later in the mission
  const t=n.e/(D.horizon||1),h=210-150*Math.min(1,Math.max(0,t));
  return "hsl("+h+" 62% 48%)";
}

function drawTL(){
  const r=fit(tl);tctx.clearRect(0,0,r.width,r.height);
  const F=D.frames,pad=4,H=r.height;
  const lo=D.lo,hi=D.hi,span=(hi-lo)||1,bud=D.budget||1;
  const X=t=>(t/bud)*r.width,Y=v=>H-pad-((v-lo)/span)*(H-2*pad-10);
  tctx.strokeStyle=css("--grid");tctx.lineWidth=1;
  for(let k=0;k<=4;k++){const y=pad+ (H-2*pad-10)*k/4;tctx.beginPath();tctx.moveTo(0,y);tctx.lineTo(r.width,y);tctx.stroke();}
  tctx.strokeStyle=css("--shake");tctx.globalAlpha=.32;tctx.lineWidth=1;
  F.forEach(f=>{if(f.v!=="shake")return;const x=X(f.t);tctx.beginPath();tctx.moveTo(x,H-10);tctx.lineTo(x,H-3);tctx.stroke();});
  tctx.globalAlpha=1;
  tctx.strokeStyle=css("--ghost");tctx.lineWidth=1;tctx.beginPath();
  F.forEach((f,k)=>{const x=X(f.t),y=Y(f.f??lo);k?tctx.lineTo(x,y):tctx.moveTo(x,y);});tctx.stroke();
  tctx.strokeStyle=css("--best");tctx.lineWidth=1.9;tctx.beginPath();
  F.forEach((f,k)=>{const x=X(f.t),y=Y(f.b);k?tctx.lineTo(x,y):tctx.moveTo(x,y);});tctx.stroke();
  const f=F[i],px=X(f.t);
  tctx.strokeStyle=css(OPC[f.e]||"--twoopt");tctx.lineWidth=1.6;
  tctx.beginPath();tctx.moveTo(px,0);tctx.lineTo(px,H-2);tctx.stroke();
  tctx.fillStyle=css("--muted");tctx.font="10px "+css("--mono").split(",")[0].replace(/"/g,"");
  tctx.textAlign="left";tctx.fillText(fmt(hi),4,10);
  tctx.textAlign="right";tctx.fillText(Math.round(D.budget)+" s",r.width-4,H-2);
}

function rail(){
  const f=D.frames[i];
  document.querySelector(".verdict .dot").style.background=css(OPC[f.e]||"--twoopt");
  document.getElementById("vtext").textContent=
    (OPN[f.e]||f.e)+(f.v==="shake"?" — targets removed":" — accepted");
  const prev=i>0?D.frames[i-1]:null,d=prev&&f.f!=null&&prev.f!=null?f.f-prev.f:null;
  document.getElementById("ev").innerHTML=
    row("Wall clock",f.t.toFixed(1)+" s")+row("Iteration",fmt(f.it))+
    row("Targets",f.r.length-1)+row("Objective",fmt(f.f))+
    row("Change",d==null?"—":`<span class="delta ${d>=0?"up":"down"}">${d>=0?"+":""}${fmt(d)}</span>`)+
    row("Best so far",fmt(f.b))+row("Rejected since",fmt(f.np));
  document.getElementById("seq").innerHTML=
    "<b>depot</b> &rarr; " + f.r.slice(1).map(n=>String(n)).join(" &rarr; ") + " &rarr; <b>depot</b>";
  const box=document.getElementById("cands");
  if(!f.c.length){box.innerHTML='<p class="empty">Not recorded for this event.</p>';return;}
  const mx=Math.max(...f.c.map(c=>c[1]))||1,col=css(OPC[f.e]||"--twoopt");
  box.innerHTML=f.c.map(c=>
    `<div class="cand"><span class="id">${c[0]}</span>`+
    `<span class="bar"><i style="width:${Math.max(3,100*c[1]/mx).toFixed(1)}%;background:${col}"></i></span>`+
    `<span class="w">${c[1].toPrecision(3)}</span></div>`).join("");
}
const row=(k,v)=>`<span>${k}</span><span>${v}</span>`;

const mmss=s=>{const m=Math.floor(s/60);return m+"m "+String(Math.round(s-60*m)).padStart(2,"0")+"s";};

function hover(ev){
  const tip=document.getElementById("tip"),r=map.getBoundingClientRect(),P=proj(r);
  const mx=ev.clientX-r.left,my=ev.clientY-r.top;
  let best=null,bd=14*14;
  for(const n of D.nodes){const q=P(n),dd=(q[0]-mx)**2+(q[1]-my)**2;if(dd<bd){bd=dd;best=n;}}
  if(!best){tip.hidden=true;return;}
  const f=D.frames[i],pos=f.r.indexOf(best.id),on=pos>=0,dep=best.id===D.depot;
  const a=D.arr[best.id];
  let rows="";
  const row=(k,v,cls)=>rows+=`<dt>${k}</dt><dd class="${cls||""}">${v}</dd>`;
  if(dep){
    row("Return by", mmss(D.horizon));
  }else{
    row("Window opens", mmss(best.e));
    row("Window closes", mmss(best.l));
    const g=best.g||0;
    row("Reward slope", (g>=0?"+":"")+g.toFixed(3)+" / s", g>=0?"":"warn");
  }
  if(on&&!dep){
    row("Visit", pos+" of "+(f.r.length-1));
    if(a!=null) row(D.est?"Earliest arrival":"Arrival", mmss(a), a>best.l?"warn":"");
    const sIn=D.spd[best.id], sOut=D.spd[f.r[pos+1]!==undefined?f.r[pos+1]:D.depot];
    if(sIn!=null) row("Speed in", sIn.toFixed(1)+" m/s");
    if(sOut!=null) row("Speed out", sOut.toFixed(1)+" m/s");
    const li=D.loi?D.loi[best.id]:null;
    if(li!=null) row("Loiter in", (li/1000).toFixed(2)+" km");
    if(D.est) rows+='<dt></dt><dd style="color:var(--muted)">estimated</dd>';
  }
  tip.innerHTML=`<h3>${dep?"Depot":"Target "+best.id}<em>${dep?"start and end":(on?"scheduled":"not scheduled")}</em></h3><dl>${rows}</dl>`;
  tip.hidden=false;
  const q=P(best),w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(Math.max(6,q[0]+12),r.width-w-6)+"px";
  tip.style.top =Math.min(Math.max(6,q[1]-h-12),r.height-h-6)+"px";
}

function render(){drawMap();drawTL();rail();
  document.getElementById("pos").textContent=
    D.frames[i].t.toFixed(1)+" s  ·  event "+(i+1)+" of "+D.frames.length;}

function go(n){i=Math.max(0,Math.min(D.frames.length-1,n));render();}

function tick(ts){
  if(!playing)return;
  if(!last)last=ts;
  acc+=(ts-last)/1000*Number(document.getElementById("speed").value)*6;last=ts;
  while(acc>=1){acc-=1;if(i>=D.frames.length-1){playing=false;
    document.getElementById("play").textContent="Play";break;}i++;}
  render();requestAnimationFrame(tick);
}

function boot(D0){
  D=D0;D.byId={};D.nodes.forEach(n=>D.byId[n.id]=n);
  const ttl=document.getElementById("title");
  if(ttl){if(ttl.firstChild)ttl.firstChild.nodeValue=D.instance;else ttl.prepend(D.instance);}
  document.getElementById("subtitle").textContent=
    Math.round(D.budget)+" s from the "+(D.start||"greedy")+" start";
  document.title=D.instance.replace(/\s*\(\d+\)/,"")+" Search Replay";
  D.horizon=Math.max(...D.nodes.map(n=>n.l));
  const fs=D.frames.map(f=>f.f).filter(v=>v!=null).concat(D.frames.map(f=>f.b));
  D.lo=Math.min(...fs)*0.997;D.hi=Math.max(...fs)*1.003;
  if(!(D.hi>D.lo)){D.lo-=1;D.hi+=1;}
  // counts come from the whole run, not from the frames the page shows
  const T=D.totals||{};
  const n={accepted:T.accepted??D.frames.filter(f=>f.v==="accepted").length,
           shake:T.shake??D.frames.filter(f=>f.v==="shake").length};
  const rejected=(T.refused??0)+(T.infeasible??0)
    || D.frames.reduce((a,f)=>a+f.np,0);
  document.getElementById("stats").innerHTML=
    st("Best objective",fmt(D.hi/1.003))+st("Route changes",fmt(n.accepted))+
    st("Shakes",fmt(n.shake))+st("Rejected",fmt(rejected))+
    st("Frames shown",fmt(D.frames.length));
  render();
  addEventListener("resize",render);
  map.addEventListener("pointermove",hover);
  map.addEventListener("pointerleave",()=>{document.getElementById("tip").hidden=true;});
  document.getElementById("play").onclick=e=>{playing=!playing;last=0;
    e.target.textContent=playing?"Pause":"Play";if(playing)requestAnimationFrame(tick);};
  document.getElementById("next").onclick=()=>go(i+1);
  document.getElementById("prev").onclick=()=>go(i-1);
  document.getElementById("tobest").onclick=()=>{
    let bi=0,bv=-Infinity;D.frames.forEach((f,k)=>{if(f.b>bv){bv=f.b;bi=k;}});go(bi);};
  ["tProp","tWin","tIds"].forEach(id=>document.getElementById(id).onchange=render);
  const scrub=ev=>{const r=tl.getBoundingClientRect();
    const t=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*D.budget;
    let bi=0,bd=Infinity;D.frames.forEach((f,k)=>{const d=Math.abs(f.t-t);if(d<bd){bd=d;bi=k;}});go(bi);};
  tl.onpointerdown=e=>{tl.setPointerCapture(e.pointerId);scrub(e);};
  tl.onpointermove=e=>{if(e.buttons)scrub(e);};
  tl.onkeydown=e=>{if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1);};
  addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
    if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1);
    if(e.key===" "){e.preventDefault();document.getElementById("play").click();}});
}
const st=(k,v)=>`<div class="stat"><dt>${k}</dt><dd>${v}</dd></div>`;

try{boot(JSON.parse(document.getElementById("trace-data").textContent));}
catch(err){document.getElementById("stats").innerHTML=
  '<div class="stat"><dt>Trace</dt><dd>'+err.message+'</dd></div>';throw err;}
</script>

</body>
</html>
